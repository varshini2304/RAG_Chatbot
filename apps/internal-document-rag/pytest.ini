[pytest]
markers =
    integration: tests that call external services and require valid credentials

norecursedirs = .* build dist CVS _darcs {arch} +node_modules tmp venv .venv
testpaths = tests

log_cli = false
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S
